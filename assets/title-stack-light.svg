@media (prefers-reduced-motion: no-preference) {
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.65,0,.2,1) .3s forwards; }
  .float { animation: float 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .float.b { animation-duration: 8.5s; animation-delay: -3s; }
  .float.c { animation-duration: 6s; animation-delay: -1.5s; }
  .spin { animation: spin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes float { 50% { transform: translateY(-10px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .45; } }
